# Production-like local run:
#   docker compose up --build      then open http://localhost:8000
# If port 8000 is taken on your machine, pick another:
#   HOST_PORT=8080 docker compose up --build
services:
  app:
    build: .
    image: wind-forecast-portal
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
